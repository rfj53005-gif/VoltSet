<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VoltSet · SM8850</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-var: #edf1f7;
      --text: #111827;
      --muted: #4b5563;
      --border: #e2e6ec;
      --primary: #1e40af;
      --on-primary: #ffffff;
      --primary-container: #dbe7ff;
      --on-primary-container: #0f2557;
      --secondary-container: #ccfbf1;
      --on-secondary-container: #0b4641;
      --good-bg: #e6f6ee;
      --good-fg: #0a5c38;
      --good-accent: #15803d;
      --warn-bg: #fff4de;
      --warn-fg: #7a4100;
      --warn-border: #e5a93b;
      --danger-bg: #fdecec;
      --danger-fg: #8c1d18;
      --danger-border: #c62828;
      --track: #eaf0f6;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1218;
        --surface: #161b22;
        --surface-var: #212731;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #2b313b;
        --primary: #8bb2ff;
        --on-primary: #072259;
        --primary-container: #173678;
        --on-primary-container: #dbe7ff;
        --secondary-container: #115e59;
        --on-secondary-container: #ccfbf1;
        --good-bg: #0f3524;
        --good-fg: #8ce2b3;
        --good-accent: #4ade80;
        --warn-bg: #3a280a;
        --warn-fg: #fcd38d;
        --warn-border: #d97706;
        --danger-bg: #3f1616;
        --danger-fg: #fca5a5;
        --danger-border: #f87171;
        --track: #252a34;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    .tnum { font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top, 0px);
    }
    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-title { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
    .brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65vw; }
    .progress-bar {
      height: 3px;
      background: var(--primary-container);
      overflow: hidden;
      display: none;
    }
    .progress-bar.active { display: block; }
    .progress-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--primary);
      animation: slide 1.1s infinite ease-in-out;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 16px calc(86px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .card.highlight { border: 1.5px solid var(--primary); }
    .card.pending { border: 1.5px solid var(--warn-border); }
    .card.primary-hero {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: transparent;
    }
    .card.warn-box { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-border); }
    .card.danger-box { background: var(--danger-bg); color: var(--danger-fg); border-color: var(--danger-border); }
    .card.good-box { background: var(--good-bg); color: var(--good-fg); border-color: var(--good-accent); }
    .banner {
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }
    .banner.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-border); }
    .banner.danger { background: var(--danger-bg); color: var(--danger-fg); border: 1px solid var(--danger-border); }
    .banner.good { background: var(--good-bg); color: var(--good-fg); }
    .banner.info { background: var(--secondary-container); color: var(--on-secondary-container); }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .wrap { flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .subbox {
      background: var(--surface-var);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .subbox.primary {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .label-xs { font-size: 11px; color: var(--muted); }
    .subbox.primary .label-xs { color: inherit; opacity: 0.85; }
    .title-md { font-size: 16px; font-weight: 700; }
    .title-sm { font-size: 14px; font-weight: 600; }
    .val-lg { font-size: 20px; font-weight: 700; }
    .val-md { font-size: 15px; font-weight: 600; }
    .good-text { color: var(--good-accent); }
    .warn-text { color: var(--warn-fg); }
    .muted { color: var(--muted); font-size: 13px; }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-var);
      color: var(--muted);
      white-space: nowrap;
    }
    .chip.good { background: var(--good-bg); color: var(--good-fg); }
    .chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
    .chip.danger { background: var(--danger-bg); color: var(--danger-fg); }
    .chip.primary { background: var(--primary-container); color: var(--on-primary-container); }
    .chip.secondary { background: var(--secondary-container); color: var(--on-secondary-container); }
    button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--primary);
      padding: 6px 8px;
    }
    button.full { width: 100%; }
    button:disabled { opacity: 0.45; cursor: default; }
    select {
      border: 1px solid var(--border);
      background: var(--surface-var);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
    }
    select:disabled { opacity: 0.45; }
    .filter-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .filter-chip.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: var(--primary);
    }
    details summary {
      cursor: pointer;
      list-style: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      padding: 4px 0;
    }
    .detail-list { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
    .detail-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; padding: 3px 4px; }
    .table-card { padding: 0; overflow: hidden; }
    .table-head {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr 0.85fr 1fr;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .table-group {
      background: var(--surface-var);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
    }
    .table-row {
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .table-cols {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr 0.85fr 1fr;
      align-items: center;
      font-size: 13px;
    }
    .right { text-align: right; display: flex; justify-content: flex-end; }
    .bar-track { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--primary); opacity: 0.75; }
    .bar-fill.good { background: var(--good-accent); opacity: 1; }
    .bar-fill.warn { background: var(--warn-border); opacity: 1; }
    .sparkline-box {
      background: var(--surface-var);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sparkline-svg { width: 100%; height: 68px; display: block; }
    .check-item { padding: 11px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
    .check-item:first-child { border-top: none; padding-top: 2px; }
    .probe-item { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
    .probe-item .mono { word-break: break-all; }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bottom-nav-inner {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .nav-btn {
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 4px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-dot { width: 22px; height: 3px; border-radius: 999px; background: transparent; margin-bottom: 2px; }
    .nav-btn.active .nav-dot { background: var(--primary); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: #1f2937;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 50;
      max-width: 90vw;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      display: none;
    }
    .toast.show { display: block; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .empty-center {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div style="min-width:0">
        <div class="brand-title">VoltSet <span class="muted" style="font-weight:500">KSU</span></div>
        <div id="topbarSub" class="brand-sub">正在检测设备状态…</div>
      </div>
      <button id="refreshBtn" type="button">刷新状态</button>
    </div>
    <div id="progressBar" class="progress-bar"></div>
  </header>

  <main id="mainContent">
    <div class="empty-center">正在通过 KernelSU 读取设备状态与 SCMI 电压表…</div>
  </main>

  <nav class="bottom-nav" aria-label="主导航">
    <div class="bottom-nav-inner">
      <button class="nav-btn active" data-tab="sets" type="button"><span class="nav-dot"></span><span>调压档位</span></button>
      <button class="nav-btn" data-tab="power" type="button"><span class="nav-dot"></span><span>实时功耗</span></button>
      <button class="nav-btn" data-tab="voltage" type="button"><span class="nav-dot"></span><span>SCMI 电压</span></button>
      <button class="nav-btn" data-tab="compat" type="button"><span class="nav-dot"></span><span>设备检测</span></button>
    </div>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalBackdrop" class="modal-backdrop">
    <div id="modalContent" class="modal"></div>
  </div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
